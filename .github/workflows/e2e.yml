name: e2e

on:
  push:
    branches: [main]
  pull_request:

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Only Chromium: the suite drives a canvas, and the geometry it asserts on is the same
      # in every engine. Add browsers here if a rendering difference ever becomes the bug.
      - run: npx playwright install --with-deps chromium

      # playwright.config.ts starts the backend and vite itself, on their own ports and
      # against a database it seeds from source — nothing to set up here.
      - run: npm test

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
